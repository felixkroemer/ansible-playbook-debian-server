- name: ansible-playbook-debian-server
  hosts: localhost,
  become: yes
  become_method: su
  become_flags: "-"
  roles:
    - ansible-role-nfs
  tasks:
    - name: Ensure data partition is mounted
      ansible.posix.mount:
        path: /data
        src: UUID=cf815afe-91db-4301-9108-2d907a93bec0
        fstype: ext4
        opts: defaults
        state: mounted
    - name: Ensure .ssh directory exists
      file:
        path: /home/fekr/.ssh
        state: directory
        owner: fekr
        group: fekr
        mode: '0700'
    - name: Copy ssh authorized_keys from Github
      shell:
        cmd: wget -O /home/fekr/.ssh/authorized_keys https://gist.githubusercontent.com/felixkroemer/c628ea1015e56f7d2f42f0c92c67ec92/raw
    - name: Copy authorized-keys-sync systemd service unit
      template:
        src: templates/authorized-keys-sync.service.j2
        dest: /etc/systemd/system/authorized-keys-sync.service
        mode: '0644'
    - name: Copy authorized-keys-sync systemd timer unit
      template:
        src: templates/authorized-keys-sync.timer.j2
        dest: /etc/systemd/system/authorized-keys-sync.timer
        mode: '0644'
    - name: Reload systemd daemon for new units
      systemd:
        daemon_reload: yes
    - name: Enable and start authorized-keys-sync timer
      systemd:
        name: authorized-keys-sync.timer
        enabled: yes
        state: started
  vars_files:
    - vault.yml
  vars:
    nfs_exports: [ "/data    *(rw,sync)" ]